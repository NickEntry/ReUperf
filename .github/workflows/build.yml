name: Build Thread Scheduler

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64, x86]
        build_type: [dynamic, static]
        api_level: [29]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Clean Build Directory
      run: |
        rm -rf build CMakeCache.txt CMakeFiles cmake_install.cmake
        echo "Cleaned build artifacts"

    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

    - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
      id: setup-ndk
      with:
        ndk-version: r26b
        add-to-path: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential zip

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.arch }} \
          -DANDROID_PLATFORM=android-${{ matrix.api_level }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DANDROID_STL=c++_${{ matrix.build_type == 'static' && 'static' || 'shared' }} \
          -DBUILD_STATIC=${{ matrix.build_type == 'static' && 'ON' || 'OFF' }} \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DCMAKE_CXX_EXTENSIONS=OFF \
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -O2 -ffunction-sections -fdata-sections" \
          -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections" \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -S .

    - name: Build Project
      run: cmake --build build --config Release --parallel $(nproc)

    - name: Verify Binary
      run: |
        BINARY="build/thread_scheduler"
        if [ ! -f "$BINARY" ]; then
          echo "ERROR: Binary not found at $BINARY"
          exit 1
        fi
        echo "File info:"
        file "$BINARY"
        echo "Binary validation passed"

    - name: Package Magisk Module
      run: |
        chmod +x scripts/package_module.sh
        NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
        echo "NDK path: $NDK_PATH"
        bash scripts/package_module.sh \
          --binary build/thread_scheduler \
          --arch ${{ matrix.arch }} \
          --type ${{ matrix.build_type }} \
          --ndk "$NDK_PATH" \
          --output out

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: thread_scheduler-${{ matrix.arch }}-${{ matrix.build_type }}
        path: build/thread_scheduler
        retention-days: 30
        if-no-files-found: error

    - name: Upload Module Zip Artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: ReUperf-module-${{ matrix.arch }}-${{ matrix.build_type }}
        path: out/ReUperf-*.zip
        retention-days: 30
        if-no-files-found: error
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build nlohmann-json3-dev

    - name: Configure Host Tests
      run: |
        cmake -S . -B build-host -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTING=ON \
          -DREUPERF_ENABLE_SANITIZERS=ON

    - name: Build Host Tests
      run: cmake --build build-host --parallel

    - name: Run Host Tests
      run: ctest --test-dir build-host --verbose --output-on-failure --timeout 30
